name: Deploy next public project to Vercel
# Retest after user refreshed Vercel token with All Projects scope

on:
  schedule:
    - cron: "0 3 * * *" # 08:30 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-project.yml"

permissions:
  contents: read

concurrency:
  group: daily-vercel-project-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Select a deployable public website repository
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: Ansuman123580
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/users/$OWNER/repos?type=public&sort=updated&direction=desc&per_page=100" > /tmp/repos.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const repos = JSON.parse(fs.readFileSync('/tmp/repos.json','utf8'));
          const skip = new Set(['project-promo-automation','demo-tech','backend','impress-backend-final','admin-impress','react','test-1','ansuman123580']);
          const candidates = repos.filter(r => !r.private && !r.fork && !r.archived && !r.disabled && !skip.has(r.name.toLowerCase()) && r.default_branch);
          if (!candidates.length) throw new Error('No eligible public repositories found');
          const day = Math.floor(Date.now() / 86400000);
          // Rotate daily, but start from today's slot and skip empty repos at deploy time.
          const ordered = [...candidates.slice(day % candidates.length), ...candidates.slice(0, day % candidates.length)];
          fs.writeFileSync('/tmp/candidates.json', JSON.stringify(ordered));
          NODE
          while IFS=$'\t' read -r name clone_url full_name branch; do
            if git ls-remote --exit-code "$clone_url" "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Selected $full_name ($branch)"
              {
                echo "name=$name"
                echo "url=$clone_url"
                echo "full_name=$full_name"
                echo "branch=$branch"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Skipping $full_name: branch $branch has no remote ref"
          done < <(node --input-type=module -e "import fs from 'node:fs'; for (const r of JSON.parse(fs.readFileSync('/tmp/candidates.json','utf8'))) console.log([r.name,r.clone_url,r.full_name,r.default_branch].join('\t'))")
          echo "No repository with an existing default branch was found."
          exit 1
      - name: Check out selected project
        env:
          CLONE_URL: ${{ steps.pick.outputs.url }}
          BRANCH: ${{ steps.pick.outputs.branch }}
        run: |
          set -euo pipefail
          git clone --depth 1 --single-branch --branch "$BRANCH" "$CLONE_URL" project
          if [ ! -f project/index.html ] && [ ! -f project/package.json ]; then
            echo "Selected repository has no root index.html or package.json; refusing to deploy a blank site."
            exit 1
          fi
      - name: Deploy project to Vercel
        working-directory: project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_NAME: ${{ steps.pick.outputs.name }}
          REPOSITORY_NAME: ${{ steps.pick.outputs.full_name }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN repository secret"; exit 1; }
          echo "Checking Vercel token identity (token is never printed)..."
          if ! npx --yes vercel@latest whoami --token "$VERCEL_TOKEN"; then
            echo "::error::Vercel token authentication failed. Create a token under the same Vercel account that owns the target project, then update the VERCEL_TOKEN GitHub Actions secret."
            exit 1
          fi
          echo "Checking Vercel scope..."
          if ! npx --yes vercel@latest teams ls --token "$VERCEL_TOKEN"; then
            echo "::error::Vercel token works but team listing failed. Check whether VERCEL_ORG_ID is actually the correct team scope, not a project ID."
            exit 1
          fi
          # Use the account/team slug explicitly; do not export VERCEL_ORG_ID here,
          # because Vercel CLI interprets that env var as a linked-project deployment
          # and then requires VERCEL_PROJECT_ID.
          npx --yes vercel@latest deploy --prod --yes --name "$PROJECT_NAME" --scope "ansuman123580s-projects" --token "$VERCEL_TOKEN" | tee /tmp/vercel-deploy.txt
          URL="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' /tmp/vercel-deploy.txt | tail -n 1 || true)"
          if [ -z "$URL" ]; then echo "Could not extract deployment URL from Vercel output"; cat /tmp/vercel-deploy.txt; exit 1; fi
          echo "### Deployment result" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository: $REPOSITORY_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live URL: $URL" >> "$GITHUB_STEP_SUMMARY"
