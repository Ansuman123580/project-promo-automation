name: Deploy LinkedIn publisher to Vercel

on:
  push:
    branches: [main]
    paths:
      - "api/linkedin/publish.js"
      - ".github/workflows/deploy-publisher.yml"

permissions:
  contents: read

jobs:
  deploy-publisher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy publisher API to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "::error::Missing VERCEL_TOKEN"; exit 1; }
          npx --yes vercel@latest whoami --token "$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prod --yes --name "project-promo-automation" --scope "ansuman123580s-projects" --token "$VERCEL_TOKEN" | tee /tmp/deploy.txt
          PROJECT_JSON="$(curl -fsSL -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/project-promo-automation?slug=ansuman123580s-projects")"
          PROJECT_ID="$(node -e 'const p=JSON.parse(process.argv[1]); process.stdout.write(p.id || "")' "$PROJECT_JSON")"
          test -n "$PROJECT_ID"
          curl -fsSL -X PATCH "https://api.vercel.com/v9/projects/$PROJECT_ID?slug=ansuman123580s-projects" -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" --data '{"ssoProtection":null}' >/dev/null
          echo "Public project protection disabled."
